[project]
name = "wallpaper-daemon"
version = "0.1.0"
description = "A lightweight Python wallpaper manager for Linux."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
wallpaper-manager = "src.main:main"

dependencies = [
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
